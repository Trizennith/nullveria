  mysql:
    image: mysql:8.4 #😭Please do not upgrade this to 9.x.x,
    container_name: nullveria.mysql.standalone
    platform: linux/amd64
    restart: always
    ports:
      - '${MYSQL_PORT}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_DATABASE_SHADOW: nullveria_shadow
    command: ['mysqld', '--mysql-native-password=ON']
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - local_network

  redis:
    image: redis:8.0.1-alpine
    container_name: nullveria.redis.standalone
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
    networks:
      - local_network
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql_data:
  redis_data:

networks:
  local_network:
    driver: bridge
